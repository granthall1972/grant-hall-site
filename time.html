      <p>Epoch &harr; human &harr; timezone &harr; relative. Runs in the browser.</p>

    <div class="tool">
      <div class="tool-row">
        <span>Input &mdash; epoch seconds/millis, or any date string</span>
        <input type="text" id="in" class="tool-field" spellcheck="false" autocomplete="off" placeholder="1735689600 or 2025-01-01T00:00:00Z">
      </div>
      <div class="tool-actions">
        <button type="button" id="now" class="tool-btn sub">now</button>
      </div>

        <span>Timezone (IANA)</span>
        <input type="text" id="tz" class="tool-field" spellcheck="false" autocomplete="off" list="tzlist">
        <datalist id="tzlist">
          <option value="UTC"></option>
          <option value="America/New_York"></option>

          <option value="Asia/Shanghai"></option>
          <option value="Asia/Tokyo"></option>
          <option value="Australia/Sydney"></option>
        </datalist>
      </div>

<script src="script.js?v=13" defer></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var localZone = "";
  try { localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
  $("tz").value = localZone || "UTC";

  function parse(raw) {
    var s = raw.trim();
    if (!s) return null;
    if (/^-?\d+$/.test(s)) {
      var n = parseInt(s, 10);
      // <= 11 digits: treat as seconds; more: milliseconds
      var ms = Math.abs(n) < 1e11 ? n * 1000 : n;
      return new Date(ms);
    }
    var d = new Date(s);
    return isNaN(d.getTime()) ? NaN : d;
  }

  function relative(then, now) {
    var s = Math.round((then - now) / 1000);
    var rtf;
    try { rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" }); }
    catch (e) { return (s >= 0 ? "in " : "") + Math.abs(s) + "s" + (s < 0 ? " ago" : ""); }
    var units = [["year", 31536000], ["month", 2592000], ["week", 604800],
                 ["day", 86400], ["hour", 3600], ["minute", 60], ["second", 1]];
    for (var i = 0; i < units.length; i++) {
      if (Math.abs(s) >= units[i][1] || units[i][0] === "second") {
        return rtf.format(Math.round(s / units[i][1]), units[i][0]);
      }
    }
  }

  function inZone(d, tz) {
    try {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
        timeZoneName: "short"
      }).format(d);
    } catch (e) { return "invalid timezone"; }
  }

  function row(label, value) {
    return "<div><b>" + label + "</b> &nbsp; " + value + "</div>";
  }

  function render() {
    $("msg").textContent = "";
    $("msg").className = "tool-msg";
    var d = parse($("in").value);
    if (d === null) { $("out").innerHTML = ""; return; }
    if (typeof d === "number" || isNaN(d.getTime())) {
      $("out").innerHTML = "";
      $("msg").textContent = "Couldn't parse that.";
      $("msg").className = "tool-msg jwt-bad";
      return;
    }
    var ms = d.getTime();
    var esc = function (t) { return t.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); };
    var html = "";
    html += row("Unix seconds", Math.floor(ms / 1000));
    html += row("Unix millis", ms);
    html += row("ISO 8601 (UTC)", esc(d.toISOString()));
    html += row("UTC", esc(d.toUTCString()));
    html += row("Local", esc(d.toString()));
    html += row("In " + esc($("tz").value || "UTC"), esc(inZone(d, $("tz").value || "UTC")));
    html += row("Relative", esc(relative(ms, Date.now())));
    $("out").innerHTML = html;
  }

  $("in").addEventListener("input", render);
  $("tz").addEventListener("input", render);
  $("now").addEventListener("click", function () {
    $("in").value = String(Date.now());
    render();
  });

  render();
})();
</script>
