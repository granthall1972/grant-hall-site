<main>
  <div class="wrap">
    <a class="back-link" href="tools.html">&larr; Tools</a>
    <div class="page-head">
      <h1>Format</h1>
      <p>Paste JSON or YAML. It detects which and pretty-prints it.</p>
    </div>

    <div class="fmt">
      <div class="fmt-controls">
        <select id="fmt-type" class="fmt-select">
          <option value="auto">Auto-detect</option>
          <option value="json">JSON</option>
          <option value="yaml">YAML</option>
        </select>
        <select id="fmt-indent" class="fmt-select">
          <option value="2">2 spaces</option>
          <option value="4">4 spaces</option>
        </select>
        <span id="fmt-detected" class="fmt-detected"></span>
      </div>

      <textarea id="fmt-in" class="fmt-area" rows="12" placeholder="paste here" spellcheck="false" autocomplete="off"></textarea>

      <div class="fmt-actions">
        <button type="button" id="fmt-run" class="fmt-btn">Format</button>
        <button type="button" id="fmt-copy" class="fmt-btn fmt-btn-sub">copy output</button>
      </div>

      <textarea id="fmt-out" class="fmt-area" rows="12" readonly placeholder="result" spellcheck="false"></textarea>
      <div id="fmt-msg" class="fmt-msg"></div>
    </div>
  </div>
</main>

<script src="script.js" defer></script>
<script src="js-yaml.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var inEl = $("fmt-in");
  var outEl = $("fmt-out");
  var typeSel = $("fmt-type");
  var indentSel = $("fmt-indent");
  var detEl = $("fmt-detected");
  var msgEl = $("fmt-msg");

  function msg(m) { msgEl.textContent = m; }

  // String-context-aware repair for loose JSON: unquoted keys, single quotes,
  // trailing commas, // and /* */ comments, bare-word string values.
  function relaxedToJson(src) {
    var out = "", i = 0, n = src.length;
    while (i < n) {
      var c = src[i];

      if (c === '"' || c === "'") {
        var quote = c, str = "";
        i++;
        while (i < n) {
          var ch = src[i];
          if (ch === "\\") {
            var next = src[i + 1] || "";
            if (quote === "'" && next === "'") { str += "'"; i += 2; continue; }
            str += ch + next; i += 2; continue;
          }
          if (ch === quote) { i++; break; }
          if (ch === '"' && quote === "'") { str += '\\"'; i++; continue; }
          if (ch === "\n") { str += "\\n"; i++; continue; }
          str += ch; i++;
        }
        out += '"' + str + '"';
        continue;
      }

      if (c === "/" && src[i + 1] === "/") {
        i += 2;
        while (i < n && src[i] !== "\n") i++;
        continue;
      }
      if (c === "/" && src[i + 1] === "*") {
        i += 2;
        while (i < n && !(src[i] === "*" && src[i + 1] === "/")) i++;
        i += 2;
        continue;
      }

      if (c === ",") {
        var j = i + 1;
        while (j < n && /\s/.test(src[j])) j++;
        if (src[j] === "}" || src[j] === "]") { i++; continue; }
        out += c; i++;
        continue;
      }

      if (/[A-Za-z_$]/.test(c)) {
        var start = i;
        while (i < n && /[A-Za-z0-9_$-]/.test(src[i])) i++;
        var word = src.slice(start, i);
        if (word === "true" || word === "false" || word === "null") { out += word; continue; }
        var k = i;
        while (k < n && /\s/.test(src[k])) k++;
        out += '"' + word + '"';   // key (":" follows) or bare string value
        continue;
      }

      out += c; i++;
    }
    return out;
  }

  // JSON is also valid YAML, so try JSON first (strict, then loose).
  function detect(text) {
    var t = text.trim();
    if (!t) return null;
    try { JSON.parse(t); return "json"; } catch (e) {}
    if (/^[{\[]/.test(t)) {
      try { JSON.parse(relaxedToJson(t)); return "json"; } catch (e) {}
    }
    if (typeof jsyaml !== "undefined") {
      try {
        var v = jsyaml.load(t);
        if (v !== null && typeof v === "object") return "yaml";
      } catch (e) {}
    }
    return null;
  }

  function run() {
    var input = inEl.value;
    var indent = parseInt(indentSel.value, 10);
    if (!input.trim()) { outEl.value = ""; detEl.textContent = ""; msg(""); return; }

    var mode = typeSel.value;
    var kind = mode === "auto" ? detect(input) : mode;
    if (!kind) { detEl.textContent = ""; outEl.value = ""; msg("Not recognized as JSON or YAML."); return; }
    detEl.textContent = (mode === "auto" ? "detected: " : "type: ") + kind.toUpperCase();

    try {
      if (kind === "json") {
        var parsed, repaired = false;
        try {
          parsed = JSON.parse(input);
        } catch (e1) {
          parsed = JSON.parse(relaxedToJson(input));
          repaired = true;
        }
        outEl.value = JSON.stringify(parsed, null, indent);
        msg(repaired ? "Loose JSON repaired (unquoted keys / quotes / commas / comments)." : "");
        return;
      }
      {
        if (typeof jsyaml === "undefined") { msg("YAML library didn't load."); outEl.value = ""; return; }
        outEl.value = jsyaml.dump(jsyaml.load(input), {
          indent: indent, lineWidth: -1, noRefs: true, sortKeys: false
        });
      }
      msg("");
    } catch (e) {
      outEl.value = "";
      msg((kind === "json" ? "JSON" : "YAML") + " error: " + (e && e.message ? e.message : e));
    }
  }

  var timer = null;
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(run, 150);
  }

  inEl.addEventListener("input", schedule);
  typeSel.addEventListener("change", run);
  indentSel.addEventListener("change", run);
  $("fmt-run").addEventListener("click", run);

  $("fmt-copy").addEventListener("click", function () {
    var btn = this;
    var text = outEl.value;
    if (!text) return;
    var flash = function (ok) {
      btn.textContent = ok ? "copied" : "Ctrl+C";
      if (!ok) outEl.select();
      setTimeout(function () { btn.textContent = "copy output"; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(true); }, function () { flash(false); });
    } else {
      outEl.select();
      try { flash(document.execCommand("copy")); } catch (e) { flash(false); }
    }
  });
})();
</script>
</body>
</html>
