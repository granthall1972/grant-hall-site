<script src="script.js?v=13" defer></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cv = $("cv"), ctx = cv.getContext("2d");

  var EMOJI = { rock: "🪨", paper: "📄", scissors: "✂️" };
  var BEATS = { rock: "scissors", scissors: "paper", paper: "rock" };
  var LABEL = { rock: "Rock", paper: "Paper", scissors: "Scissors" };
  var KINDS = ["rock", "paper", "scissors"];

  var W = 0, H = 0, R = 16;
  var objs = [], raf = 0, lastKill = 0, startCounts = null;
  var bgColor = "#fff", fgColor = "#000";

  KINDS.concat(["speed"]).forEach(function (n) {
    $("s-" + n).addEventListener("input", function () { $("c-" + n).textContent = $("s-" + n).value; });
  });

  function sizeCanvas() {
    var w = cv.clientWidth || 800;
    W = Math.round(w);
    H = Math.round(w * 0.6);
    cv.width = W;
    cv.height = H;
    R = Math.max(11, Math.round(W / 46));
  }

  function makeObjs(counts, speed) {
    var list = [];
    var base = speed * (W / 520);
    KINDS.forEach(function (type) {
      for (var i = 0; i < counts[type]; i++) {
        var ang = Math.random() * Math.PI * 2;
        list.push({
          type: type,
          x: R + Math.random() * (W - 2 * R),
          y: R + Math.random() * (H - 2 * R),
          vx: Math.cos(ang) * base,
          vy: Math.sin(ang) * base,
          dead: false
        });
      }
    });
    return list;
  }

  function counts() {
    var c = { rock: 0, paper: 0, scissors: 0 };
    for (var i = 0; i < objs.length; i++) c[objs[i].type]++;
    return c;
  }
  function alive() {
    var c = counts();
    return KINDS.filter(function (t) { return c[t] > 0; });
  }

  function step() {
    var target = parseInt($("s-speed").value, 10) * (W / 520);
    var i, j, a, b;

    for (i = 0; i < objs.length; i++) {
      a = objs[i];
      a.x += a.vx;
      a.y += a.vy;
      if (a.x < R) { a.x = R; a.vx = Math.abs(a.vx); }
      else if (a.x > W - R) { a.x = W - R; a.vx = -Math.abs(a.vx); }
      if (a.y < R) { a.y = R; a.vy = Math.abs(a.vy); }
      else if (a.y > H - R) { a.y = H - R; a.vy = -Math.abs(a.vy); }
    }

    for (i = 0; i < objs.length; i++) {
      a = objs[i];
      if (a.dead) continue;
      for (j = i + 1; j < objs.length; j++) {
        b = objs[j];
        if (b.dead) continue;
        var dx = b.x - a.x, dy = b.y - a.y;
        var d2 = dx * dx + dy * dy;
        var min = 2 * R;
        if (d2 > min * min) continue;
        var d = Math.sqrt(d2) || 0.0001;
        var nx = dx / d, ny = dy / d;

        if (a.type === b.type) {
          var overlap = min - d;
          a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
          b.x += nx * overlap / 2; b.y += ny * overlap / 2;
          var avn = a.vx * nx + a.vy * ny, bvn = b.vx * nx + b.vy * ny;
          a.vx += (bvn - avn) * nx; a.vy += (bvn - avn) * ny;
          b.vx += (avn - bvn) * nx; b.vy += (avn - bvn) * ny;
        } else {
          var winr = BEATS[a.type] === b.type ? a : b;
          var losr = winr === a ? b : a;
          losr.dead = true;
          var s = winr === a ? -1 : 1;
          winr.x += nx * R * s;
          winr.y += ny * R * s;
          lastKill = performance.now();
        }
      }
    }

    for (i = objs.length - 1; i >= 0; i--) if (objs[i].dead) objs.splice(i, 1);

    for (i = 0; i < objs.length; i++) {
      a = objs[i];
      var sp = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
      if (sp < 0.01) {
        var ang = Math.random() * Math.PI * 2;
        a.vx = Math.cos(ang) * target;
        a.vy = Math.sin(ang) * target;
      } else {
        a.vx = a.vx / sp * target;
        a.vy = a.vy / sp * target;
      }
    }
  }

  function draw() {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);

    ctx.font = (R * 1.8) + "px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var i = 0; i < objs.length; i++) {
      ctx.fillText(EMOJI[objs[i].type], objs[i].x, objs[i].y);
    }

    var c = counts();
    ctx.font = "14px 'JetBrains Mono', monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = fgColor;
    ctx.fillText(EMOJI.rock + " " + c.rock + "    " + EMOJI.paper + " " + c.paper + "    " + EMOJI.scissors + " " + c.scissors, 12, 12);
  }

  function loop() {
    step();
    draw();
    var live = alive();
    var stalled = performance.now() - lastKill > 20000;
    if (live.length <= 1 || (stalled && objs.length)) {
      finish(live, stalled);
      return;
    }
    raf = requestAnimationFrame(loop);
  }

  function finish(live, stalled) {
    cancelAnimationFrame(raf);
    var c = counts();
    var winner = null;
    if (live.length === 1) {
      winner = live[0];
    } else if (stalled) {
      var order = KINDS.slice().sort(function (x, y) { return c[y] - c[x]; });
      winner = c[order[0]] > c[order[1]] ? order[0] : null;
    }
    $("win-emoji").textContent = winner ? EMOJI[winner] : "🤝";
    $("win-title").textContent = winner ? LABEL[winner] + " wins!" : "It's a draw";
    $("win-sub").textContent = "Started with " + startCounts.rock + " " + EMOJI.rock + "  " +
      startCounts.paper + " " + EMOJI.paper + "  " + startCounts.scissors + " " + EMOJI.scissors +
      (stalled && winner ? "  ·  called on numbers after a stalemate" : "");
    $("overlay").hidden = false;
  }

  function begin(counts0) {
    cancelAnimationFrame(raf);
    $("overlay").hidden = true;
    $("setup").hidden = true;
    $("stage").hidden = false;
    sizeCanvas();
    var cs = getComputedStyle(document.body);
    bgColor = cs.backgroundColor || "#fff";
    fgColor = cs.color || "#000";
    startCounts = counts0;
    objs = makeObjs(counts0, parseInt($("s-speed").value, 10));
    lastKill = performance.now();
    draw();
    if (alive().length <= 1) { finish(alive(), false); return; }
    raf = requestAnimationFrame(loop);
  }

  $("start").addEventListener("click", function () {
    var c = {
      rock: parseInt($("s-rock").value, 10),
      paper: parseInt($("s-paper").value, 10),
      scissors: parseInt($("s-scissors").value, 10)
    };
    if (c.rock + c.paper + c.scissors < 2) {
      $("setup-msg").textContent = "Add at least two objects.";
      return;
    }
    $("setup-msg").textContent = "";
    begin(c);
  });
  $("rematch").addEventListener("click", function () { begin(startCounts); });
  $("restart").addEventListener("click", function () {
    cancelAnimationFrame(raf);
    $("overlay").hidden = true;
    $("stage").hidden = true;
    $("setup").hidden = false;
  });
})();
</script>
</body>
