<script src="script.js?v=21" defer></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  function words(s) {
    return s.replace(/([a-z0-9])([A-Z])/g, "$1 $2").split(/[^A-Za-z0-9]+/).filter(Boolean);
  }
  function deburr(s) {
    return s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  }
  function lines(s) { return s.split("\n"); }

  var OPS = {
    case: {
      "UPPER": function (s) { return s.toUpperCase(); },
      "lower": function (s) { return s.toLowerCase(); },
      "Title Case": function (s) { return s.replace(/\w\S*/g, function (t) { return t[0].toUpperCase() + t.slice(1).toLowerCase(); }); },
      "Sentence case": function (s) { return s.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, function (m) { return m.toUpperCase(); }); },
      "camelCase": function (s) { return words(s).map(function (w, i) { w = w.toLowerCase(); return i ? w[0].toUpperCase() + w.slice(1) : w; }).join(""); },
      "PascalCase": function (s) { return words(s).map(function (w) { w = w.toLowerCase(); return w[0].toUpperCase() + w.slice(1); }).join(""); },
      "snake_case": function (s) { return words(s).map(function (w) { return w.toLowerCase(); }).join("_"); },
      "kebab-case": function (s) { return words(s).map(function (w) { return w.toLowerCase(); }).join("-"); },
      "slugify": function (s) { return deburr(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
    },
    lines: {
      "sort A→Z": function (s) { return lines(s).sort(function (a, b) { return a.localeCompare(b); }).join("\n"); },
      "sort Z→A": function (s) { return lines(s).sort(function (a, b) { return b.localeCompare(a); }).join("\n"); },
      "dedupe": function (s) { var seen = {}; return lines(s).filter(function (l) { return seen[l] ? false : (seen[l] = true); }).join("\n"); },
      "reverse": function (s) { return lines(s).reverse().join("\n"); },
      "shuffle": function (s) { var a = lines(s); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a.join("\n"); },
      "trim each": function (s) { return lines(s).map(function (l) { return l.trim(); }).join("\n"); },
      "drop blank": function (s) { return lines(s).filter(function (l) { return l.trim() !== ""; }).join("\n"); },
      "number": function (s) { return lines(s).map(function (l, i) { return (i + 1) + ". " + l; }).join("\n"); }
    },
    other: {
      "reverse chars": function (s) { return s.split("").reverse().join(""); },
      "collapse spaces": function (s) { return s.replace(/[^\S\n]+/g, " ").replace(/ *\n */g, "\n"); },
      "strip accents": function (s) { return deburr(s); },
      "remove punctuation": function (s) { return s.replace(/[^\w\s]|_/g, ""); },
      "escape HTML": function (s) { return s.replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); },
      "JSON string": function (s) { return JSON.stringify(s); }
    }
  };

  function refreshStats() {
    var v = $("in").value;
    var w = v.trim() ? v.trim().split(/\s+/).length : 0;
    var ln = v === "" ? 0 : v.split("\n").length;
    var bytes = new TextEncoder().encode(v).length;
    $("stats").innerHTML = "<span>Counts</span>" +
      v.length + " chars &middot; " + w + " words &middot; " + ln + " lines &middot; " + bytes + " bytes";
  }

  function apply(fn) {
    try { $("out").value = fn($("in").value); }
    catch (e) { $("out").value = "error: " + (e && e.message ? e.message : e); }
  }

  Object.keys(OPS).forEach(function (group) {
    var box = document.querySelector('.tool-ops[data-group="' + group + '"]');
    Object.keys(OPS[group]).forEach(function (name) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tool-btn sub";
      b.textContent = name;
      b.addEventListener("click", function () { apply(OPS[group][name]); });
      box.appendChild(b);
    });
  });

  $("in").addEventListener("input", refreshStats);
  $("use").addEventListener("click", function () {
    if (!$("out").value) return;
    $("in").value = $("out").value;
    refreshStats();
  });
  $("copy").addEventListener("click", function () {
    var text = $("out").value;
    if (!text) return;
    var btn = this;
    var done = function (ok) {
      btn.textContent = ok ? "copied" : "Ctrl+C";
      setTimeout(function () { btn.textContent = "copy"; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  });

  refreshStats();
})();
</script>
</body>
