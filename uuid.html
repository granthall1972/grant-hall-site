      <h1>UUID / ULID</h1>
      <p>Bulk random identifiers from a CSPRNG. Nothing leaves the browser.</p>
    </div>

    <div class="tool">
      <div class="tool-row">
        <span>Type</span>
        <select id="type" class="tool-select">
          <option value="uuid">UUID v4</option>
          <option value="ulid">ULID</option>
        </select>
      </div>
      <div class="tool-row">
        <span>Count</span>
        <input type="number" id="count" class="tool-field" value="10" min="1" max="1000">
      </div>
      <label class="tool-check"><input type="checkbox" id="upper"> uppercase</label>
      <label class="tool-check"><input type="checkbox" id="nodash"> strip dashes (UUID)</label>

      <div class="tool-actions">
        <button type="button" id="gen" class="tool-btn">Generate</button>
        <button type="button" id="copy" class="tool-btn sub">copy</button>
      </div>

      <textarea id="out" class="tool-area" rows="12" readonly spellcheck="false"></textarea>
      <div id="msg" class="tool-msg"></div>
    </div>

<script src="script.js" defer></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ENC = "0123456789ABCDEFGHJKMNPQRSTVWXYZ"; // Crockford base32

  function uuid4() {
    if (crypto.randomUUID) return crypto.randomUUID();
    var b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var h = [];
    for (var i = 0; i < 16; i++) h.push(b[i].toString(16).padStart(2, "0"));
    return h.slice(0, 4).join("") + "-" + h.slice(4, 6).join("") + "-" +
           h.slice(6, 8).join("") + "-" + h.slice(8, 10).join("") + "-" + h.slice(10, 16).join("");
  }

  function ulidTime(now) {
    var out = "";
    for (var i = 0; i < 10; i++) { out = ENC[now % 32] + out; now = Math.floor(now / 32); }
    return out;
  }
  function ulidRandom() {
    var bytes = crypto.getRandomValues(new Uint8Array(10)); // 80 bits -> 16 chars
    var bits = 0, val = 0, out = "";
    for (var i = 0; i < bytes.length; i++) {
      val = (val << 8) | bytes[i];
      bits += 8;
      while (bits >= 5) { bits -= 5; out += ENC[(val >>> bits) & 31]; }
      val &= (1 << bits) - 1;
    }
    return out;
  }
  function ulid() { return ulidTime(Date.now()) + ulidRandom(); }

  function generate() {
    $("msg").textContent = "";
    var n = Math.max(1, Math.min(1000, parseInt($("count").value, 10) || 1));
    $("count").value = n;
    var isUuid = $("type").value === "uuid";
    var lines = [];
    for (var i = 0; i < n; i++) {
      var v = isUuid ? uuid4() : ulid();
      if (isUuid && $("nodash").checked) v = v.replace(/-/g, "");
      v = $("upper").checked ? v.toUpperCase() : (isUuid ? v.toLowerCase() : v);
      lines.push(v);
    }
    $("out").value = lines.join("\n");
    $("msg").textContent = n + (isUuid ? " UUID" : " ULID") + (n === 1 ? "" : "s") + " generated";
  }

  $("gen").addEventListener("click", generate);
  $("type").addEventListener("change", generate);
  $("upper").addEventListener("change", generate);
  $("nodash").addEventListener("change", generate);

  $("copy").addEventListener("click", function () {
    var text = $("out").value;
    if (!text) return;
    var btn = this;
    var done = function (ok) {
      btn.textContent = ok ? "copied" : "Ctrl+C";
      setTimeout(function () { btn.textContent = "copy"; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  });

  generate();
})();
</script>
