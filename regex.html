<main>
  <div class="wrap">
    <a class="back-link" href="tools.html">&larr; Tools</a>
    <div class="page-head">
      <h1>Regex Tester</h1>
      <p>Live match highlighting, capture groups, and replace. Runs in the browser.</p>
    </div>

    <div class="tool">
      <div class="tool-row">
        <span>Pattern</span>
        <input type="text" id="pat" class="tool-field" spellcheck="false" autocomplete="off" placeholder="\b\w+@\w+\.\w+\b">
      </div>
      <div class="tool-row">
        <span>Flags</span>
        <input type="text" id="flags" class="tool-field tool-num" value="gim" spellcheck="false" autocomplete="off" placeholder="gimsuy">
      </div>
      <div class="tool-row">
        <span>Test string</span>
        <textarea id="str" class="tool-area" rows="6" spellcheck="false" autocomplete="off"></textarea>
      </div>

      <div id="msg" class="tool-msg"></div>

      <div class="tool-row"><span>Highlighted</span></div>
      <div class="rx-hl" id="hl"></div>

      <div class="tool-row" id="count"><span>Matches</span>&mdash;</div>
      <div class="jwt-claims" id="matches"></div>

      <div class="tool-row">
        <span>Replace with ($1, $&lt;name&gt;, $&amp; supported)</span>
        <input type="text" id="rep" class="tool-field" spellcheck="false" autocomplete="off">
      </div>
      <div class="tool-row">
        <span>Result</span>
        <textarea id="repout" class="tool-area" rows="4" readonly spellcheck="false"></textarea>
      </div>
    </div>
  </div>
</main>

<script src="script.js?v=13" defer></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }

  function render() {
    $("msg").textContent = "";
    $("msg").className = "tool-msg";
    var pat = $("pat").value;
    var flags = $("flags").value;
    var str = $("str").value;

    if (!pat) { $("hl").textContent = str; $("matches").innerHTML = ""; $("count").innerHTML = "<span>Matches</span>&mdash;"; $("repout").value = ""; return; }

    var re, reG;
    try {
      re = new RegExp(pat, flags);
      reG = new RegExp(pat, flags.indexOf("g") === -1 ? flags + "g" : flags);
    } catch (e) {
      $("msg").textContent = "Invalid regex: " + (e && e.message ? e.message : e);
      $("msg").className = "tool-msg jwt-bad";
      $("hl").textContent = str;
      $("matches").innerHTML = "";
      $("repout").value = "";
      return;
    }

    var out = "", last = 0, m, list = [], guard = 0;
    while ((m = reG.exec(str)) !== null) {
      out += esc(str.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
      last = m.index + m[0].length;
      list.push(m);
      if (m[0] === "") reG.lastIndex++;
      if (++guard > 100000) break;
    }
    out += esc(str.slice(last));
    $("hl").innerHTML = out || "&nbsp;";

    $("count").innerHTML = "<span>Matches</span>" + list.length + (guard > 100000 ? " (capped)" : "");
    var shown = flags.indexOf("g") === -1 ? list.slice(0, 1) : list;
    $("matches").innerHTML = shown.map(function (mm, i) {
      var parts = "<div><b>#" + (i + 1) + "</b> &nbsp; [" + mm.index + "–" + (mm.index + mm[0].length) + "] &nbsp; " + esc(JSON.stringify(mm[0]));
      for (var g = 1; g < mm.length; g++) parts += "<br>&nbsp;&nbsp;$" + g + " = " + (mm[g] === undefined ? "∅" : esc(JSON.stringify(mm[g])));
      if (mm.groups) Object.keys(mm.groups).forEach(function (k) {
        parts += "<br>&nbsp;&nbsp;$&lt;" + esc(k) + "&gt; = " + (mm.groups[k] === undefined ? "∅" : esc(JSON.stringify(mm.groups[k])));
      });
      return parts + "</div>";
    }).join("") || "<div>no matches</div>";

    try { $("repout").value = str.replace(re, $("rep").value); }
    catch (e) { $("repout").value = "replace error: " + (e && e.message ? e.message : e); }
  }

  ["pat", "flags", "str", "rep"].forEach(function (id) {
    $(id).addEventListener("input", render);
  });

  $("str").value = "Contact a@b.com or c@d.org — not this.";
  render();
})();
</script>
</body>
