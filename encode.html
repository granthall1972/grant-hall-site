<main>
  <div class="wrap">
    <a class="back-link" href="tools.html">&larr; Tools</a>
    <div class="page-head">
      <h1>Encode / Decode</h1>
      <p>Base64 and URL encoding for text or files. All local.</p>
    </div>

    <div class="tool">
      <div class="seg">
        <button type="button" class="seg-btn is-active" data-mode="text">Text</button>
        <button type="button" class="seg-btn" data-mode="file">File</button>
      </div>

      <section id="text-mode">
        <div class="tool-row">
          <span>Operation</span>
          <select id="op" class="tool-select">
            <option value="b64-enc">Base64 encode</option>
            <option value="b64-dec">Base64 decode</option>
            <option value="b64url-enc">Base64URL encode</option>
            <option value="b64url-dec">Base64URL decode</option>
            <option value="url-enc">URL-encode (component)</option>
            <option value="url-dec">URL-decode (component)</option>
            <option value="urlfull-enc">URL-encode (whole URL)</option>
            <option value="urlfull-dec">URL-decode (whole URL)</option>
          </select>
        </div>
        <div class="tool-row">
          <span>Input</span>
          <textarea id="t-in" class="tool-area" rows="5" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <div class="tool-actions">
          <button type="button" id="t-swap" class="tool-btn sub">swap &#8597;</button>
          <button type="button" id="t-copy" class="tool-btn sub">copy output</button>
        </div>
        <div class="tool-row">
          <span>Output</span>
          <textarea id="t-out" class="tool-area" rows="5" readonly spellcheck="false"></textarea>
        </div>
        <div id="t-msg" class="tool-msg"></div>
      </section>

      <section id="file-mode" hidden>
        <div class="tool-row">
          <span>File &rarr; Base64</span>
          <input type="file" id="f-in">
        </div>
        <label class="tool-check"><input type="checkbox" id="f-datauri"> as data URI (include mime type)</label>
        <textarea id="f-out" class="tool-area" rows="5" readonly spellcheck="false" placeholder="base64 output"></textarea>
        <div class="tool-actions"><button type="button" id="f-copy" class="tool-btn sub">copy</button></div>

        <div class="tool-row">
          <span>Base64 &rarr; File</span>
          <textarea id="d-in" class="tool-area" rows="5" spellcheck="false" autocomplete="off" placeholder="paste base64 or data URI"></textarea>
        </div>
        <div class="tool-row">
          <span>Save as</span>
          <input type="text" id="d-name" class="tool-field" value="decoded.bin" autocomplete="off">
        </div>
        <div class="tool-actions"><button type="button" id="d-run" class="tool-btn">Decode &amp; download</button></div>
        <a id="d-link" class="tool-dl" hidden></a>
        <div id="f-msg" class="tool-msg"></div>
      </section>
    </div>
  </div>

<script src="script.js?v=13" defer></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TE = new TextEncoder(), TD = new TextDecoder();

  function binToBytes(bin) {
    var b = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b;
  }
  function bytesToBin(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return s;
  }
  function b64enc(bytes) { return btoa(bytesToBin(bytes)); }
  function b64dec(str) { return binToBytes(atob(str.replace(/\s+/g, ""))); }
  function toUrlSafe(b64) { return b64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function fromUrlSafe(s) {
    s = s.trim().replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return s;
  }

  var OPS = {
    "b64-enc": function (t) { return b64enc(TE.encode(t)); },
    "b64-dec": function (t) { return TD.decode(b64dec(t)); },
    "b64url-enc": function (t) { return toUrlSafe(b64enc(TE.encode(t))); },
    "b64url-dec": function (t) { return TD.decode(b64dec(fromUrlSafe(t))); },
    "url-enc": function (t) { return encodeURIComponent(t); },
    "url-dec": function (t) { return decodeURIComponent(t); },
    "urlfull-enc": function (t) { return encodeURI(t); },
    "urlfull-dec": function (t) { return decodeURI(t); }
  };
  var INVERSE = {
    "b64-enc": "b64-dec", "b64-dec": "b64-enc",
    "b64url-enc": "b64url-dec", "b64url-dec": "b64url-enc",
    "url-enc": "url-dec", "url-dec": "url-enc",
    "urlfull-enc": "urlfull-dec", "urlfull-dec": "urlfull-enc"
  };

  var tIn = $("t-in"), tOut = $("t-out"), opSel = $("op"), tMsg = $("t-msg");

  function runText() {
    tMsg.textContent = "";
    var v = tIn.value;
    if (!v) { tOut.value = ""; return; }
    try {
      tOut.value = OPS[opSel.value](v);
    } catch (e) {
      tOut.value = "";
      tMsg.textContent = "Couldn't " + opSel.value.replace("-", " ") + ": " + (e && e.message ? e.message : e);
    }
  }

  tIn.addEventListener("input", runText);
  opSel.addEventListener("change", runText);
  $("t-swap").addEventListener("click", function () {
    if (!tOut.value) return;
    tIn.value = tOut.value;
    if (INVERSE[opSel.value]) opSel.value = INVERSE[opSel.value];
    runText();
  });

  function wireCopy(btn, getText, label) {
    btn.addEventListener("click", function () {
      var text = getText();
      if (!text) return;
      var done = function (ok) {
        btn.textContent = ok ? "copied" : "Ctrl+C";
        setTimeout(function () { btn.textContent = label; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      } else { done(false); }
    });
  }
  wireCopy($("t-copy"), function () { return tOut.value; }, "copy output");
  wireCopy($("f-copy"), function () { return $("f-out").value; }, "copy");

  /* file -> base64 */
  var fIn = $("f-in"), fOut = $("f-out"), fData = $("f-datauri"), fMsg = $("f-msg");
  async function fileToB64() {
    fMsg.textContent = "";
    var file = fIn.files[0];
    if (!file) { fOut.value = ""; return; }
    try {
      var bytes = new Uint8Array(await file.arrayBuffer());
      var b64 = b64enc(bytes);
      fOut.value = fData.checked
        ? "data:" + (file.type || "application/octet-stream") + ";base64," + b64
        : b64;
    } catch (e) {
      fMsg.textContent = "Read failed: " + (e && e.message ? e.message : e);
    }
  }
  fIn.addEventListener("change", fileToB64);
  fData.addEventListener("change", fileToB64);

  /* base64 -> file */
  $("d-run").addEventListener("click", function () {
    fMsg.textContent = "";
    var v = $("d-in").value.trim();
    if (!v) { fMsg.textContent = "Paste some base64 first."; return; }
    var mime = "application/octet-stream";
    var m = v.match(/^data:([^;,]*);?(base64)?,([\s\S]*)$/);
    if (m) { if (m[1]) mime = m[1]; v = m[3]; }
    try {
      var bytes = b64dec(fromUrlSafe(v));
      var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
      var link = $("d-link");
      link.href = url;
      link.download = $("d-name").value || "decoded.bin";
      link.textContent = "Download " + link.download;
      link.hidden = false;
      link.click();
      fMsg.textContent = "Decoded " + bytes.length + " bytes.";
    } catch (e) {
      fMsg.textContent = "Not valid base64.";
    }
  });

  var segs = document.querySelectorAll(".seg-btn");
  segs.forEach(function (b) {
    b.addEventListener("click", function () {
      segs.forEach(function (x) { x.classList.toggle("is-active", x === b); });
      var text = b.getAttribute("data-mode") === "text";
      $("text-mode").hidden = !text;
      $("file-mode").hidden = text;
    });
  });

  runText();
})();
</script>
</body>
</html>
