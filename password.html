<main>
  <div class="wrap">
    <a class="back-link" href="tools.html">&larr; Tools</a>
    <div class="page-head">
      <h1>Password Generator</h1>
      <p>Random strings or diceware passphrases, from <code>crypto.getRandomValues</code>. Nothing is stored or sent.</p>
    </div>

    <div class="tool">
      <div class="seg">
        <button type="button" class="seg-btn is-active" data-mode="random">Random</button>
        <button type="button" class="seg-btn" data-mode="phrase">Passphrase</button>
      </div>

      <section id="random-mode">
        <div class="tool-row">
          <span>Length: <b id="len-val">20</b></span>
          <input type="range" id="len" min="6" max="128" value="20" class="tool-range">
        </div>
        <label class="tool-check"><input type="checkbox" id="lc" checked> lowercase a&ndash;z</label>
        <label class="tool-check"><input type="checkbox" id="uc" checked> uppercase A&ndash;Z</label>
        <label class="tool-check"><input type="checkbox" id="dg" checked> digits 0&ndash;9</label>
        <label class="tool-check"><input type="checkbox" id="sy" checked> symbols !@#$&hellip;</label>
        <label class="tool-check"><input type="checkbox" id="amb"> avoid ambiguous (O 0 I l 1 |)</label>
      </section>

      <section id="phrase-mode" hidden>
        <div class="tool-row">
          <span>Words: <b id="wc-val">6</b></span>
          <input type="range" id="wc" min="3" max="12" value="6" class="tool-range">
        </div>
        <div class="tool-row">
          <span>Separator</span>
          <select id="sep" class="tool-select">
            <option value="-">hyphen</option>
            <option value=" ">space</option>
            <option value="_">underscore</option>
            <option value=".">dot</option>
            <option value="">none</option>
          </select>
        </div>
        <label class="tool-check"><input type="checkbox" id="cap"> Capitalize Words</label>
        <label class="tool-check"><input type="checkbox" id="num"> append a number</label>
      </section>

      <div class="tool-row">
        <span>Result &mdash; <span id="bits" class="tool-hint"></span></span>
        <textarea id="out" class="tool-area" rows="2" readonly spellcheck="false"></textarea>
      </div>
      <div class="tool-actions">
        <button type="button" id="regen" class="tool-btn">Regenerate</button>
        <button type="button" id="copy" class="tool-btn sub">copy</button>
      </div>
      <div id="msg" class="tool-msg"></div>
    </div>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // EFF short wordlist (1296 words) — https://www.eff.org/dice
  var WORDS = ("acid acorn acre acts afar affix aged agent agile aging agony ahead aide aids aim ajar alarm alias alibi alien alike alive aloe aloft aloha alone amend amino ample amuse angel anger angle ankle apple april apron aqua area arena argue arise armed armor army aroma array arson art ashen ashes atlas atom attic audio avert avoid awake award awoke axis bacon badge bagel baggy baked baker balmy banjo barge barn bash basil bask batch bath baton bats blade blank blast blaze bleak blend bless blimp blink bloat blob blog blot blunt blurt blush boast boat body boil bok bolt boned boney bonus bony book booth boots boss botch both boxer breed bribe brick bride brim bring brink brisk broad broil broke brook broom brush buck bud buggy bulge bulk bully bunch bunny bunt bush bust busy buzz cable cache cadet cage cake calm cameo canal candy cane canon cape card cargo carol carry carve case cash cause cedar chain chair chant chaos charm chase cheek cheer chef chess chest chew chief chili chill chip chomp chop chow chuck chump chunk churn chute cider cinch city civic civil clad claim clamp clap clash clasp class claw clay clean clear cleat cleft clerk click cling clink clip cloak clock clone cloth cloud clump coach coast coat cod coil coke cola cold colt coma come comic comma cone cope copy coral cork cost cot couch cough cover cozy craft cramp crane crank crate crave crawl crazy creme crepe crept crib cried crisp crook crop cross crowd crown crumb crush crust cub cult cupid cure curl curry curse curve curvy cushy cut cycle dab dad daily dairy daisy dance dandy darn dart dash data date dawn deaf deal dean debit debt debug decaf decal decay deck decor decoy deed delay denim dense dent depth derby desk dial diary dice dig dill dime dimly diner dingy disco dish disk ditch ditzy dizzy dock dodge doing doll dome donor donut dose dot dove down dowry doze drab drama drank draw dress dried drift drill drive drone droop drove drown drum dry duck duct dude dug duke duo dusk dust du d olive omen onion only ooze opal open opera opt otter ouch ounce outer oval oven owl ozone pace pagan pager palm panda panic pants panty paper park party pasta patch path patio payer pecan penny pep perch perky perm pest petal petri petty photo plank plant plaza plead plot plow pluck plug plus poach pod poem poet pogo point poise poker polar polio polka polo pond pony poppy pork poser pouch pound pout power prank press print prior prism prize probe prong proof props prude prune pry pug pull pulp pulse puma punch punk pupil puppy purr purse push putt quack quake query quiet quill quilt quit quota quote rabid race rack radar radio raft rage raid rail rake rally ramp ranch range rank rant rash raven reach react ream rebel recap relax relay relic remix repay repel reply rerun reset rhyme rice rich ride rigid rigor rinse riot ripen rise risk ritzy rival river roast robe robin rock rogue roman romp rope rover royal ruby rug ruin rule runny rush rust rut sadly sage said saint salad salon salsa salt same sandy santa satin sauna saved savor sax say scale scam scan scare scarf scary scoff scold scoop scoot scope score scorn scout scowl scrap scrub scuba scuff sect sedan self send sepia serve set seven shack shade shady shaft shaky sham shape share sharp shed sheep sheet shelf shell shine shiny ship shirt shock shop shore shout shove shown showy shred shrug shun shush shut shy sift silk silly silo sip siren sixth size skate skew skid skier skies skip skirt skit sky slab slack slain slam slang slash slate slaw sled sleek sleep sleet slept slice slick slimy sling slip slit slob slot slug slum slurp slush small smash smell smile smirk smog snack snap snare snarl sneak sneer sniff snore snort snout snowy snub snuff speak speed spend spent spew spied spill spiny spoil spoke spoof spool spoon sport spot spout spray spree spur squad squat squid stack staff stage stain stall stamp stand stank stark start stash state stays steam steep stem step stew stick sting stir stock stole stomp stony stood stool stoop stop storm stout stove straw stray strut stuck stud stuff stump stung stunt suds sugar sulk surf sushi swab swan swarm sway swear sweat sweep swell swept swim swing swipe swirl swoop swore syrup tacky taco tag take tall talon tamer tank taper taps tarot tart task taste tasty taunt thank thaw theft theme thigh thing think thong thorn those throb thud thumb thump thus tiara tidal tidy tiger tile tilt tint tiny trace track trade train trait trap trash tray treat tree trek trend trial tribe trick trio trout truce truck trump trunk try tug tulip tummy turf tusk tutor tutu tux tweak tweet twice twine twins twirl twist uncle uncut undo unify union unit untie upon upper urban used user usher utter value vapor vegan venue verse vest veto vice video view viral virus visa visor vixen vocal voice void volt voter vowel wad wafer wager wages wagon wake walk wand wasp watch water wavy wheat whiff whole whoop wick widen widow width wife wifi wilt wimp wind wing wink wipe wired wiry wise wish wispy wok wolf womb wool woozy word work worry wound woven wrath wreck wrist xerox yahoo yam yard year yeast yelp yield yo-yo yodel yoga yoyo yummy zebra zero zesty zippy zone zoom").split(" ");

  var LOWER = "abcdefghijklmnopqrstuvwxyz";
  var UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var DIGIT = "0123456789";
  var SYM = "!@#$%^&*()-_=+[]{};:,.?";
  var AMBIG = /[O0oIl1|]/g;

  function randInt(max) {
    var buf = new Uint32Array(1);
    var limit = 4294967296 - (4294967296 % max);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }

  var out = $("out"), bitsEl = $("bits"), msg = $("msg");
  var mode = "random";

  function genRandom() {
    var len = parseInt($("len").value, 10);
    var sets = [];
    if ($("lc").checked) sets.push(LOWER);
    if ($("uc").checked) sets.push(UPPER);
    if ($("dg").checked) sets.push(DIGIT);
    if ($("sy").checked) sets.push(SYM);
    if (!sets.length) { out.value = ""; bitsEl.textContent = ""; msg.textContent = "Pick at least one character set."; return; }
    msg.textContent = "";
    var amb = $("amb").checked;
    if (amb) sets = sets.map(function (s) { return s.replace(AMBIG, ""); }).filter(function (s) { return s.length; });
    var pool = sets.join("");

    var chars = [];
    if (len >= sets.length) sets.forEach(function (s) { chars.push(s[randInt(s.length)]); });
    while (chars.length < len) chars.push(pool[randInt(pool.length)]);
    for (var i = chars.length - 1; i > 0; i--) {
      var j = randInt(i + 1), t = chars[i]; chars[i] = chars[j]; chars[j] = t;
    }
    out.value = chars.join("");
    bitsEl.textContent = "~" + Math.round(len * Math.log2(pool.length)) + " bits";
  }

  function genPhrase() {
    msg.textContent = "";
    var count = parseInt($("wc").value, 10);
    var sep = $("sep").value;
    var cap = $("cap").checked;
    var parts = [];
    for (var i = 0; i < count; i++) {
      var w = WORDS[randInt(WORDS.length)];
      if (cap) w = w.charAt(0).toUpperCase() + w.slice(1);
      parts.push(w);
    }
    var phrase = parts.join(sep);
    var bits = count * Math.log2(WORDS.length);
    if ($("num").checked) { var n = randInt(90) + 10; phrase += sep + n; bits += Math.log2(90); }
    out.value = phrase;
    bitsEl.textContent = "~" + Math.round(bits) + " bits";
  }

  function gen() { if (mode === "random") genRandom(); else genPhrase(); }

  $("len").addEventListener("input", function () { $("len-val").textContent = this.value; gen(); });
  $("wc").addEventListener("input", function () { $("wc-val").textContent = this.value; gen(); });
  ["lc", "uc", "dg", "sy", "amb", "sep", "cap", "num"].forEach(function (id) {
    $(id).addEventListener("change", gen);
  });
  $("regen").addEventListener("click", gen);

  $("copy").addEventListener("click", function () {
    var btn = this;
    if (!out.value) return;
    var done = function (ok) { btn.textContent = ok ? "copied" : "Ctrl+C"; setTimeout(function () { btn.textContent = "copy"; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(out.value).then(function () { done(true); }, function () { done(false); });
    } else { out.select(); done(false); }
  });

  var segs = document.querySelectorAll(".seg-btn");
  segs.forEach(function (b) {
    b.addEventListener("click", function () {
      segs.forEach(function (x) { x.classList.toggle("is-active", x === b); });
      mode = b.getAttribute("data-mode");
      $("random-mode").hidden = mode !== "random";
      $("phrase-mode").hidden = mode !== "phrase";
      gen();
    });
  });

  gen();
})();
</script>
