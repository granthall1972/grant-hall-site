        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4" y1="12" x2="2" y2="12"></line><line x1="22" y1="12" x2="20" y2="12"></line><line x1="5" y1="5" x2="6.5" y2="6.5"></line><line x1="17.5" y1="17.5" x2="19" y2="19"></line><line x1="5" y1="19" x2="6.5" y2="17.5"></line><line x1="17.5" y1="6.5" x2="19" y2="5"></line></svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>

<main>
  <div class="wrap">
    <a class="back-link" href="tools.html">&larr; Tools</a>
    <div class="page-head">
      <h1>Converter</h1>
      <p>Type a value with its unit, like <code>33mm</code>, and it picks the conversion. Or choose one from the list and just type numbers.</p>
    </div>

    <div class="converter">
      <select id="cv-pair" class="cv-select" aria-label="Conversion"></select>
      <div class="cv-row">
        <div class="cv-field">
          <div class="cv-inputwrap">
            <input id="cv-input" class="cv-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="33mm">
          </div>
        </div>
        <span class="cv-arrow">&rarr;</span>
        <div class="cv-field">
          <div class="cv-inputwrap">
            <output id="cv-output" class="cv-input cv-output"></output>
            <button id="cv-copy" class="cv-btn" type="button">copy</button>
          </div>
        </div>
      </div>
      <p id="cv-hint" class="cv-hint"></p>
    </div>
  </div>
</main>

<script src="script.js" defer></script>
<script>
(function () {
  // Each entry is one directional conversion and one dropdown option.
  // `tokens` are the unit strings that auto-select it when typed. An empty
  // list means the entry is only reachable by picking it from the dropdown.
  var PAIRS = [
    { from: "Celsius", to: "Fahrenheit", tokens: ["c", "celsius", "centigrade"], fn: function (x) { return x * 9 / 5 + 32; } },
    { from: "Fahrenheit", to: "Celsius", tokens: ["f", "fahrenheit"], fn: function (x) { return (x - 32) * 5 / 9; } },
    { from: "Celsius", to: "Kelvin", tokens: [], fn: function (x) { return x + 273.15; } },
    { from: "Kelvin", to: "Celsius", tokens: ["k", "kelvin"], fn: function (x) { return x - 273.15; } },
    { from: "Millimeters", to: "Inches", tokens: ["mm", "millimeter", "millimeters", "millimetre", "millimetres"], fn: function (x) { return x / 25.4; } },
    { from: "Centimeters", to: "Inches", tokens: ["cm", "centimeter", "centimeters", "centimetre", "centimetres"], fn: function (x) { return x / 2.54; } },
    { from: "Inches", to: "Centimeters", tokens: ["in", "inch", "inches", '"'], fn: function (x) { return x * 2.54; } },
    { from: "Inches", to: "Millimeters", tokens: [], fn: function (x) { return x * 25.4; } },
    { from: "Meters", to: "Feet", tokens: ["m", "meter", "meters", "metre", "metres"], fn: function (x) { return x / 0.3048; } },
    { from: "Feet", to: "Meters", tokens: ["ft", "foot", "feet", "'"], fn: function (x) { return x * 0.3048; } },
    { from: "Kilometers", to: "Miles", tokens: ["km", "kilometer", "kilometers", "kilometre", "kilometres"], fn: function (x) { return x / 1.609344; } },
    { from: "Miles", to: "Kilometers", tokens: ["mi", "mile", "miles"], fn: function (x) { return x * 1.609344; } },
    { from: "Grams", to: "Ounces", tokens: ["g", "gram", "grams", "gramme", "grammes"], fn: function (x) { return x / 28.349523125; } },
    { from: "Ounces", to: "Grams", tokens: ["oz", "ounce", "ounces"], fn: function (x) { return x * 28.349523125; } },
    { from: "Kilograms", to: "Pounds", tokens: ["kg", "kilogram", "kilograms", "kilo", "kilos"], fn: function (x) { return x / 0.45359237; } },
    { from: "Pounds", to: "Kilograms", tokens: ["lb", "lbs", "pound", "pounds"], fn: function (x) { return x * 0.45359237; } },
    { from: "Liters", to: "US gallons", tokens: ["l", "liter", "liters", "litre", "litres"], fn: function (x) { return x / 3.785411784; } },
    { from: "US gallons", to: "Liters", tokens: ["gal", "gallon", "gallons"], fn: function (x) { return x * 3.785411784; } },
    { from: "Milliliters", to: "US fluid ounces", tokens: ["ml", "milliliter", "milliliters", "millilitre", "millilitres"], fn: function (x) { return x / 29.5735295625; } },
    { from: "US fluid ounces", to: "Milliliters", tokens: ["floz", "fluidounce", "fluidounces"], fn: function (x) { return x * 29.5735295625; } },
    { from: "km/h", to: "mph", tokens: ["kmh", "kph", "kmph"], fn: function (x) { return x / 1.609344; } },
    { from: "mph", to: "km/h", tokens: ["mph", "mih"], fn: function (x) { return x * 1.609344; } },
    { from: "Square meters", to: "Square feet", tokens: ["m2", "sqm", "squaremeter", "squaremeters"], fn: function (x) { return x / 0.09290304; } },
    { from: "Square feet", to: "Square meters", tokens: ["ft2", "sqft", "squarefoot", "squarefeet"], fn: function (x) { return x * 0.09290304; } },
    { from: "Hectares", to: "Acres", tokens: ["ha", "hectare", "hectares"], fn: function (x) { return x / 0.40468564224; } },
    { from: "Acres", to: "Hectares", tokens: ["ac", "acre", "acres"], fn: function (x) { return x * 0.40468564224; } }
  ];

  var sel = document.getElementById("cv-pair");
  var input = document.getElementById("cv-input");
  var output = document.getElementById("cv-output");
  var hintEl = document.getElementById("cv-hint");

  PAIRS.forEach(function (p, i) {
    var o = document.createElement("option");
    o.value = i;
    o.textContent = p.from + "  →  " + p.to;
    sel.appendChild(o);
  });

  function fmt(n) {
    if (!isFinite(n)) return "–";
    return parseFloat(n.toPrecision(7)).toString();
  }

  function parse(s) {
    var m = s.trim().match(/^([+-]?(?:\d+\.?\d*|\.\d+))\s*(.*)$/);
    if (!m) return null;
    var rawToken = m[2].trim();
    var token = rawToken.toLowerCase().replace(/\s+/g, "").replace(/\//g, "").replace(/²/g, "2").replace(/°/g, "");
    return { num: parseFloat(m[1]), token: token, rawToken: rawToken };
  }

  function pairForToken(token) {
    for (var i = 0; i < PAIRS.length; i++) {
      if (PAIRS[i].tokens.indexOf(token) !== -1) return i;
    }
    return -1;
  }

  function render() {
    var p = parse(input.value);
    hintEl.textContent = "";
    if (p && p.token) {
      var idx = pairForToken(p.token);
      if (idx === -1) {
        hintEl.textContent = "Don't know the unit “" + p.rawToken + "” — pick from the list, or try mm, cm, kg, l, mph…";
      } else if (String(idx) !== sel.value) {
        sel.value = idx;
      }
    }
    var pair = PAIRS[sel.value];
    var num = p ? p.num : NaN;
    output.textContent = isNaN(num) ? "" : fmt(pair.fn(num));
  }

  function flash(btn, msg, back) {
    btn.textContent = msg;
    setTimeout(function () { btn.textContent = back; }, 1200);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function selectText(el) {
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    } catch (e) {}
  }

  function copyOut(btn) {
    var text = output.textContent;
    if (!text) return;
    var done = function (ok) {
      if (ok) { flash(btn, "copied", "copy"); }
      else { selectText(output); flash(btn, "Ctrl+C", "copy"); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }

  sel.addEventListener("change", render);
  input.addEventListener("input", render);
  document.getElementById("cv-copy").addEventListener("click", function () { copyOut(this); });
  render();
})();
</script>
</body>
</html>
