        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4" y1="12" x2="2" y2="12"></line><line x1="22" y1="12" x2="20" y2="12"></line><line x1="5" y1="5" x2="6.5" y2="6.5"></line><line x1="17.5" y1="17.5" x2="19" y2="19"></line><line x1="5" y1="19" x2="6.5" y2="17.5"></line><line x1="17.5" y1="6.5" x2="19" y2="5"></line></svg>

<main>
  <div class="wrap">
    <a class="back-link" href="tools.html">&larr; Tools</a>
    <div class="page-head">
      <h1>Converter</h1>
      <p>Pick a conversion and enter a value.</p>
    </div>

    <div class="converter">
      <select id="cv-pair" class="cv-select" aria-label="Conversion"></select>
      <div class="cv-row">
        <div class="cv-field">
          <div class="cv-inputwrap">
            <input id="cv-input" class="cv-input" type="text" inputmode="decimal" autocomplete="off" value="1">
          </div>
        </div>
        <span class="cv-arrow">&rarr;</span>
        <div class="cv-field">
          <div class="cv-inputwrap">
            <output id="cv-output" class="cv-input cv-output"></output>
            <button id="cv-copy" class="cv-btn" type="button">copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="script.js" defer></script>
<script>
(function () {
  // Each entry is one directional conversion and one dropdown option.
  var PAIRS = [
    { from: "Millimeters", to: "Inches", fn: function (x) { return x / 25.4; } },
    { from: "Inches", to: "Millimeters", fn: function (x) { return x * 25.4; } },
    { from: "Centimeters", to: "Inches", fn: function (x) { return x / 2.54; } },
    { from: "Inches", to: "Centimeters", fn: function (x) { return x * 2.54; } },
    { from: "Meters", to: "Feet", fn: function (x) { return x / 0.3048; } },
    { from: "Feet", to: "Meters", fn: function (x) { return x * 0.3048; } },
    { from: "Kilometers", to: "Miles", fn: function (x) { return x / 1.609344; } },
    { from: "Miles", to: "Kilometers", fn: function (x) { return x * 1.609344; } },
    { from: "Grams", to: "Ounces", fn: function (x) { return x / 28.349523125; } },
    { from: "Ounces", to: "Grams", fn: function (x) { return x * 28.349523125; } },
    { from: "Kilograms", to: "Pounds", fn: function (x) { return x / 0.45359237; } },
    { from: "Pounds", to: "Kilograms", fn: function (x) { return x * 0.45359237; } },
    { from: "Liters", to: "US gallons", fn: function (x) { return x / 3.785411784; } },
    { from: "US gallons", to: "Liters", fn: function (x) { return x * 3.785411784; } },
    { from: "Milliliters", to: "US fluid ounces", fn: function (x) { return x / 29.5735295625; } },
    { from: "US fluid ounces", to: "Milliliters", fn: function (x) { return x * 29.5735295625; } },
    { from: "km/h", to: "mph", fn: function (x) { return x / 1.609344; } },
    { from: "mph", to: "km/h", fn: function (x) { return x * 1.609344; } },
    { from: "Square meters", to: "Square feet", fn: function (x) { return x / 0.09290304; } },
    { from: "Square feet", to: "Square meters", fn: function (x) { return x * 0.09290304; } },
    { from: "Hectares", to: "Acres", fn: function (x) { return x / 0.40468564224; } },
    { from: "Acres", to: "Hectares", fn: function (x) { return x * 0.40468564224; } },
    { from: "Celsius", to: "Fahrenheit", fn: function (x) { return x * 9 / 5 + 32; } },
    { from: "Fahrenheit", to: "Celsius", fn: function (x) { return (x - 32) * 5 / 9; } },
    { from: "Celsius", to: "Kelvin", fn: function (x) { return x + 273.15; } },
    { from: "Kelvin", to: "Celsius", fn: function (x) { return x - 273.15; } }
  ];

  var sel = document.getElementById("cv-pair");
  var input = document.getElementById("cv-input");
  var output = document.getElementById("cv-output");

  PAIRS.forEach(function (p, i) {
    var o = document.createElement("option");
    o.value = i;
    o.textContent = p.from + "  →  " + p.to;
    sel.appendChild(o);
  });

  function fmt(n) {
    if (!isFinite(n)) return "–";
    return parseFloat(n.toPrecision(7)).toString();
  }

  function render() {
    var num = parseFloat(input.value);
    output.textContent = isNaN(num) ? "" : fmt(PAIRS[sel.value].fn(num));
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function selectText(el) {
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
    } catch (e) {}
  }

  function copyOut(btn) {
    var text = output.textContent;
    if (!text) return;
    var done = function (ok) {
      btn.textContent = ok ? "copied" : "Ctrl+C";
      if (!ok) selectText(output);
      setTimeout(function () { btn.textContent = "copy"; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }

  sel.addEventListener("change", render);
  input.addEventListener("input", render);
  document.getElementById("cv-copy").addEventListener("click", function () { copyOut(this); });
  render();
})();
</script>
</body>
</html>
